<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTRON EDU — Formal Models</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080c;
    --paper: #e6e1d6;
    --amber: #e2a15a;
    --cyan: #8fd0c8;
    --hot: #d25b4c;
    --dim: rgba(230, 225, 214, 0.55);
    --line: rgba(226, 161, 90, 0.45);
    --display: "Michroma", "Liberation Sans Narrow", "DejaVu Sans", sans-serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --math: "DejaVu Sans", "Liberation Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden; font-family: var(--mono); }
  button, a { font-family: inherit; cursor: pointer; }
  #app { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  .vignette, .scan { position: absolute; inset: 0; pointer-events: none; }
  .vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.58) 100%); }
  .scan { background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px); opacity: 0.45; }
  header, .copy, footer { position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none; }
  header { top: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 18px 0; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 12px; letter-spacing: 0.16em; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: pulse 2.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .series { font-size: 10px; letter-spacing: 0.28em; color: var(--cyan); text-align: center; }
  .count { justify-self: end; font-size: 12px; letter-spacing: 0.14em; }
  .copy { top: 52px; padding: 8px 18px 0; }
  .disc { font-size: 11px; letter-spacing: 0.22em; color: var(--cyan); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(17px, 2.5vw, 30px); line-height: 1.28; margin: 6px 0 0; max-width: 22em; }
  .sub { margin: 6px 0 0; max-width: 62ch; color: var(--dim); font-size: 12px; line-height: 1.45; }
  .formula { margin: 8px 0 0; color: var(--amber); font-family: var(--math); font-size: clamp(13px, 1.7vw, 18px); line-height: 1.35; max-width: 40em; }
  .tick { width: 36px; height: 1px; background: var(--amber); margin-top: 10px; opacity: 0.7; }
  footer { bottom: 0; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .readout { display: flex; flex-wrap: wrap; gap: 6px 22px; min-height: 1.4em; }
  .readout div { display: flex; gap: 10px; font-size: 12px; letter-spacing: 0.06em; }
  .readout .k { color: rgba(230,225,214,0.42); min-width: 7ch; }
  .readout .v { color: var(--amber); }
  .note { color: rgba(143, 208, 200, 0.82); font-size: 11px; letter-spacing: 0.03em; line-height: 1.4; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; pointer-events: auto; }
  .controls button, .controls a {
    flex: 1 1 64px; min-height: 44px; min-width: 64px; display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--paper); text-decoration: none;
    border: 1px solid var(--line); letter-spacing: 0.14em; font-size: 11px;
  }
  .controls button:hover, .controls a:hover, .controls button[aria-pressed="true"] { background: rgba(226, 161, 90, 0.12); }
  #bar { position: absolute; top: 0; left: 0; height: 2px; width: 0; background: var(--amber); z-index: 3; pointer-events: none; }
  #index { display: none; position: absolute; inset: 0; z-index: 4; overflow: auto; background: rgba(7, 8, 12, 0.96); padding: calc(18px + env(safe-area-inset-top)) 18px 28px; }
  #index.open { display: block; }
  #index h2 { font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: 0.18em; margin: 0 0 6px; }
  #index p.lead { margin: 0 0 14px; color: var(--dim); font-size: 12px; max-width: 62ch; line-height: 1.45; }
  .index-row { width: 100%; text-align: left; background: transparent; color: var(--paper); border: 0; border-bottom: 1px solid rgba(230,225,214,0.12); min-height: 52px; padding: 8px 0; display: grid; grid-template-columns: 4.2ch 1fr; gap: 12px; align-items: center; }
  .index-row .roman { color: var(--amber); letter-spacing: 0.08em; }
  .index-row small { display: block; color: var(--cyan); letter-spacing: 0.16em; font-size: 10px; margin-bottom: 2px; }
  .index-row.on { color: var(--amber); }
  #boot { position: absolute; left: 18px; bottom: 80px; z-index: 5; color: var(--hot); font-size: 12px; max-width: 46ch; }
  @media (max-width: 720px) { .series { display: none; } .copy { top: 44px; } h1 { font-size: 18px; } }
  @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } .scan { display: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="scan"></div>
  <div class="vignette"></div>
  <div id="bar"></div>
  <header id="top">
    <div class="brand"><span class="lamp" aria-hidden="true"></span> BTRON <span style="color:var(--amber)">EDU</span></div>
    <div class="series">FORMAL MODELS</div>
    <div class="count" id="count">I · 01</div>
  </header>
  <section class="copy" id="copy">
    <div class="disc" id="disc">CLASSICAL MECHANICS</div>
    <h1 id="title">Same start, different futures</h1>
    <p class="sub" id="sub"></p>
    <p class="formula" id="formula"></p>
    <div class="tick"></div>
  </section>
  <footer id="foot">
    <div class="readout" id="readout" aria-live="polite"></div>
    <div class="note" id="note"></div>
    <div class="controls">
      <button type="button" id="prev">PREV</button>
      <button type="button" id="hold" aria-pressed="false">HOLD</button>
      <button type="button" id="idx" aria-pressed="false">INDEX</button>
      <button type="button" id="next">NEXT</button>
      <a id="spec" href="/BTRON-EDU-SPEC.txt" target="_parent">SPEC</a>
    </div>
  </footer>
  <nav id="index" aria-label="Catalogue"></nav>
  <div id="boot" hidden></div>
</div>
<script src="edu-engine.js"></script>
</body>
</html>
